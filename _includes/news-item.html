{% assign post = include.post %}
{% assign thumb = post.thumbnail | default: post.image %}
<div class="row g-4 mb-4 align-items-center">
  <div class="col-4 col-md-3">
    <a href="{{ post.url | relative_url }}">
      {% if thumb %}<img src="{{ thumb | relative_url }}" alt="{{ post.title }}" class="img-fluid rounded news-thumb">{% endif %}
    </a>
  </div>
  <div class="col-8 col-md-9">
    <p class="text-muted small mb-1">{{ post.date | date: "%B %-d, %Y" }}</p>
    <h5 class="fw-bold"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h5>
    <p class="mb-0 d-none d-md-block">{{ post.excerpt | strip_html | truncatewords: 40 }}</p>
  </div>
</div>

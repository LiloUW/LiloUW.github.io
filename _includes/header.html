<header class="d-flex flex-column flex-md-row align-items-center pb-3 mb-5 border-bottom">
  <div>
    <a href="{{ '/' | relative_url }}" class="d-flex align-items-center text-decoration-none">
      <span class="fs-4 fw-bold">{{ site.title }}</span>
    </a>
    <a href="{{ '/' | relative_url }}" class="d-flex align-items-center text-decoration-none">
      <span>{{ site.tagline }}</span>
    </a>
  </div>
  <nav class="d-inline-flex flex-wrap flex-lg-nowrap justify-content-center mt-2 mt-md-0 ms-md-auto">
    {% for item in site.data.settings.menu %}
      <a class="mx-2 py-2 text-decoration-none{% if page.url == item.url %} fw-bold{% endif %}" href="{{ item.url | relative_url }}">{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>

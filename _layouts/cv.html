---
layout: default
---

<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">CV</h3>
    {{ content }}
    {% for cv_section in site.data.cv.sections %}
    <div class="row g-5 mb-5">
      <div class="col-md-3">
        <h4>{{ cv_section.title }}</h4>
      </div>
      <div class="col-md-9">
        {% for entry in site.data.cv[cv_section.data] %}
          <p class="fw-bold mb-1">{{ entry.title }}</p>
          <p>{{ entry.description }}</p>
        {% endfor %}
      </div>
    </div>
    {% endfor %}
  </div>
</div>

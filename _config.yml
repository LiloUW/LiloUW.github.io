# Site settings
# Built with the "academic" Jekyll theme by Paul Le (https://github.com/LeNPaul/academic, MIT License).
# Menu, contact info, social links, and images are configured in _data/settings.yml.
title: Pozzo Research Group
tagline: Chemical Engineering | University of Washington
email: dpozzo@uw.edu
description: >-
  The Pozzo Research Group at the University of Washington studies AI-driven materials discovery,
  self-assembly of soft materials, neutron scattering, and autonomous laboratories.
url: "https://LiloUW.github.io"
baseurl: ""
lang: en-US

# Author information
author:
  name: Lilo D. Pozzo
  title: Vice Chair of Operations and Boeing-Roundhill Professor
  department: Department of Chemical Engineering
  institution: University of Washington
  email: dpozzo@uw.edu
  phone: (206) 685-8536
  office: Benson Hall 259

twitter:
  username: lilopozzo

# Build settings
markdown: kramdown
permalink: /news/:year/:title/
theme: null # layouts live in this repo; stops GitHub Pages from adding its default theme
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOYMENT_INSTRUCTIONS.md
  - IMAGES_GUIDE.md
  - CLAUDE.md
  - Images
  - THEME_LICENSE.txt
  - "*.pdf"
  - vendor
